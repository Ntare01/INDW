<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Indinzi Cultural Troupe</title>
<meta name="description" content="Upcoming and past performances by Indinzi Cultural Troupe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>

  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Events</p>
      <h1>Catch us live.</h1>
      <p>From national celebrations to intimate weddings — here's where you can see Indinzi perform next.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="section-head reveal" style="max-width:none;">
        <p class="eyebrow">Upcoming</p>
        <h2>Next performance</h2>
      </div>

      <!-- Single banner-style event. Replace the image at assets/images/events-banner.jpg with your artwork. -->
      <div class="event-banner reveal">
        <img src="assets/images/event.jpeg" alt="Indinzi upcoming event" />
        <div class="event-banner-caption">
          <h3>Kigali Heritage Night</h3>
          <p class="meta">Kigali Convention Centre &middot; 6:00 PM</p>
          <p style="margin-top:12px;"><a href="contact.html" class="btn btn-outline">RSVP / Enquire</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Past events removed — page now shows a single banner for the upcoming event -->

  <section class="bg-brown">
    <div class="container" style="text-align:center;">
      <p class="eyebrow reveal">Planning something?</p>
      <h2 class="reveal" style="max-width:22ch; margin:14px auto 26px;">Bring Indinzi to your next event.</h2>
      <a href="contact.html" class="btn btn-light reveal">Request a booking</a>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="js/partials.js"></script>
<script src="js/main.js"></script>
</body>
</html>
